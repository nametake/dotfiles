###################################
# tpm plugins
###################################
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-open'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'seebi/tmux-colors-solarized'

run '~/.tmux/plugins/tpm/tpm'

###################################
# key bind
###################################
# prefix change
set-option -g prefix C-t
unbind C-b
bind C-t send-prefix
# split key
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
if-shell '[[ "`tmux -V`" =~ 1\.8 ]]' 'bind v split-window -h'
if-shell '[[ "`tmux -V`" =~ 1\.8 ]]' 'bind s split-window -v'

bind R move-window -r

set -g @layout_save_dir "~/.tmux/layouts"
set -g @layout_save_file_template "#{@layout_save_dir}/session_layout_#{session_id}.txt"
bind y run-shell '\
    save_dir=$(tmux display-message -p "#{@layout_save_dir}"); \
    mkdir -p "$save_dir"; \
    file_path=$(tmux display-message -p "#{@layout_save_file_template}"); \
    tmux display-message -p "#{window_layout}" > "$file_path"; \
    tmux display-message "Layout saved for this session!"'
bind u run-shell '\
    file_path=$(tmux display-message -p "#{@layout_save_file_template}"); \
    if [ -f "$file_path" ]; then \
        layout=$(cat "$file_path"); \
        if [ -n "$layout" ]; then \
            tmux select-layout "$layout"; \
            tmux display-message "Layout loaded!"; \
        else \
            tmux display-message "Saved layout file is empty."; \
        fi; \
    else \
        tmux display-message "No saved layout found for this session."; \
    fi'

bind b run-shell ' \
  dir=$(tmux display -p "#{pane_current_path}"); \
  branch=$(git -C "$dir" rev-parse --abbrev-ref HEAD 2>/dev/null); \
  if [ -n "$branch" ] && [ "$branch" != "main" ] && [ "$branch" != "master" ]; then \
    tmux rename-window "$branch"; \
  fi'

###################################
# Clipboard setting
###################################
# Setup 'v' to begin selection as in Vim
# bind-key -Tcopy-mode-vi 'v' send -X begin-selection
# bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
# bind-key -Tcopy-mode-vi Escape send -X cancel

###################################
# status line setting
###################################
setw -g status-left-length 30
setw -g status-left '#[fg=white,bg=black]#H#[fg=white]:#[fg=white][#S#[fg=white]]#[default]'
setw -g status-right '#[fg=white,bg=cyan,bold] [%Y-%m-%d(%a) %H:%M]#[default]'

###################################
# option
###################################
set-window-option -g mouse on
set-window-option -g mode-keys vi
set -s escape-time 0

###################################
# color setting
###################################
# set -g default-terminal "screen-256color"
# set -ag terminal-overrides ',*:U8=0'
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Do not forward cursor colour changes (OSC 12 / OSC 112) to the outer terminal.
#
# Why: switching panes/windows while a nvim :terminal was open repainted the
# whole screen slowly from the top-left in iTerm2. The chain is:
# 1. nvim's default 'guicursor' uses the TermCursor highlight in terminal
#    mode, and the colorscheme gives that group a colour, so nvim sets the
#    cursor colour with OSC 12 while a :terminal window is focused.
# 2. tmux (3.8) keeps that colour per pane and, on every full redraw
#    (pane/window switch), emits OSC 12 before and OSC 112 after each row of
#    that pane: about 2 x (screen height) sequences per switch.
# 3. iTerm2 (3.7.4) handles each OSC 12/112 by pausing its parser and
#    updating the session colour on the main thread, so every row waits for
#    a round trip and the repaint becomes visible line by line.
# Dropping the Cs/Cr capabilities makes tmux ignore cursor colour requests
# from panes, so none of these sequences reach the outer terminal. iTerm2 has
# no setting to ignore OSC 12, and no upstream issue describes the per-row
# re-send; the closest report is the cursor colour leaking through tmux to
# iTerm2: https://github.com/neovim/neovim/issues/7001
set -ga terminal-overrides ",xterm*:Cs@:Cr@"

# window-status-current
set -g window-status-current-style fg=black,bg=cyan,bold
# pane-active-border
set -g pane-active-border-style fg=black,bg=cyan

# set -g default-command "fish --init-command='set PATH (string split : $PATH)'"
# set -g default-shell /usr/local/bin/fish
set -g default-command "fish"
